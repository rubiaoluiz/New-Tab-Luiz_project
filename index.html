<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="script.js" as="script">
    <title>Nova guia</title>
    <style>
        body {
            background-color: transparent; /* Garante que o fundo seja transparente */
        }
        :root {
            --gap-x: 40px; /* MODIFIQUE AQUI O ESPAÇAMENTO HORIZONTAL */
            --gap-y: 20px; /* MODIFIQUE AQUI O ESPAÇAMENTO VERTICAL */
            --cols: 9;     /* MODIFIQUE AQUI O NÚMERO DE COLUNAS */
            --rows: 6;     /* MODIFIQUE AQUI O NÚMERO DE LINHAS */
            --font-size: 18px; /* MODIFIQUE AQUI O TAMANHO DA FONTE DOS ATALHOS */
            --tile-size: 20px; /* Tamanho do conteiner padrão dos atalhos */
            --page-button-color: rgba(30, 30, 30, 0.8);
            --page-button-text-color: white;
            --page-button-padding: 8px 12px;
            --page-button-border-radius: 5px;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: white;
            padding-top: 80px; /* Adiciona um espaço no topo para espaço dos botões de página */
            display: flex;
            flex-direction: column;
            align-items: center; /* Centraliza os elementos horizontalmente */
            min-height: 100vh; /* Define a altura do body para 100% da viewport */
            box-sizing: border-box;
            overflow: hidden; /* Impede que o conteúdo interno cause rolamento */
        }

        @media (prefers-color-scheme: dark) {
        body {
            background-color: #1e1e1e; /* Cor para tema escuro */
        }
        }

        #search-form {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px; /* Adiciona um pouco de espaço abaixo da barra de pesquisa */
            max-width: 600px;
            padding: 8px 15px;
            background-color: rgba(30, 30, 30, 0.8);
            border-radius: 25px;
            width: 100%; /* Garante que a barra de pesquisa não fique muito estreita em telas menores */
        }

        #search-form input {
            user-select: none;
            flex: 1;
            padding: 8px 16px 8px 50px;
            font-size: 16px;
            border: none;
            background: transparent;
            color: white;
            outline: none;
            min-width: 400px; /* Permite que a largura se ajuste ao container */
        }

        #search-form input::placeholder {
            color: #aaa;
        }

        #search-container {
            position: relative;
            width: 100%;
        }

        #search-form img.google-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            height: 18px;
            pointer-events: none;
            filter: none;
            user-select: none;
        }

        #page-buttons-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            gap: 5px;
        }

        .page-button {
            background-color: var(--page-button-color);
            color: var(--page-button-text-color);
            padding: var(--page-button-padding);
            border-radius: var(--page-button-border-radius);
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            border: none;
            user-select: none;
        }

        .page-button.active {
            font-weight: bold;
            /* Adicione estilos para a página ativa, se desejar */
        }

        .add-page-button {
            background-color: var(--page-button-color);
            color: var(--page-button-text-color);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            border: none;
            user-select: none;
        }

        .page-button-context-menu {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            border-radius: 4px;
            position: absolute;
            z-index: 1001; /* Acima do context menu dos atalhos */
        }

        .page-button-context-menu div {
            cursor: pointer;
            padding: 4px 0;
        }

        .page-button-context-menu div:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #grid {   /* Estilo da grade de atalhos */
            display: grid;
            grid-template-columns: repeat(var(--cols), 1fr);
            grid-template-rows: repeat(var(--rows), 1fr);
            gap: var(--gap-y) var(--gap-x);
            padding: 20px;
            max-width: 1000px;
            width: 100%; /* Garante que a grade não fique muito estreita em telas menores */
            margin-bottom: 20px; /* Adiciona um pouco de espaço abaixo da grade */
        }

        .tile {   /* Estilo dos atalhos */
            text-align: center;
            text-decoration: none;
            color: white;
            font-size: var(--font-size);
            user-select: none;
        }

        .tile img {   /* Ícone do atalho */
            width: 52px; /* Tamanho do ícone */
            height: 52px; /* Tamanho do ícone */
            object-fit: contain;
            margin-bottom: 6px; /* Espaço entre o ícone e o texto */
        }

        .tile:visited {
            color: white;
        }

        .add-btn {   /* Botão de adicionar atalho */
            width: 60px;
            height: 60px;
            font-size: 32px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px dashed white;
            border-radius: 10px;
            cursor: pointer;
        }

        #settings-btn {   /* Botão de configurações */
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(255,255,255,0.05); /* Fundo do botão */
            color: white;
            border: none;
            padding: 13px 18px;
            cursor: pointer;
            border-radius: 8px;
            z-index: 101; /* Garante que o botão esteja acima do painel */
            user-select: none;
        }

        #settings-panel {
            position: fixed;
            bottom: 60px;
            left: 16px;
            background: rgba(20, 20, 20, 0.45); /* Fundo do painel */
            padding: 10px;
            border-radius: 8px;
            display: none; /* Inicialmente oculto */
            flex-direction: column;
            gap: 6px;
            z-index: 100; /* Garante que o painel esteja acima do conteúdo principal */
        }

        #settings-panel label {
            font-size: 14px;
        }

        #clock-container {
            position: fixed;
            top: 100px; /* Distância do topo */
            right: 125px; /* Distância da direita */
            color: white;
            font-size: 7.5em; /* Tamanho da fonte do relógio */
            z-index: 102; /* Acima de outros elementos fixos */
            background-color: transparent; /* Fundo transparente */
            padding: 8px; /* Espaçamento interno */
            border-radius: 8px; /* Bordas arredondadas */
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Alinha texto à direita */
            user-select: none;
        }

        #clock {
            margin-bottom: 5px;
            font-family: Bahnschrift-light;
        }

        #date {
            font-size: 0.2em; /* Tamanho menor da fonte para a data */
            color: white;
            font-family: Bahnschrift-light;
            text-align: right; /* Alinha texto à direita */
        }
    </style>
</head>
<body>
    <div id="clock-container">
        <div id="clock"></div>
        <div id="date"></div>
    </div>

    <form id="search-form" action="https://www.google.com/search" method="get">
        <div id="search-container">
            <img class="google-icon" src="https://www.google.com/favicon.ico" alt="Google" />
            <input type="text" name="q" placeholder="Pesquise com Google ou digite um endereço" autocomplete="off" style="border-bottom: none; padding-right: 16px;" />
        </div>
    </form>

    <div id="page-buttons-container">
        <button id="add-page-button" title="Adicionar nova página">+</button>
    </div>

    <div id="grid"></div>

    <button id="settings-btn">☰</button>
    <div id="settings-panel">
        <label for="wallpaper-url">URL do Wallpaper:</label>
        <input type="url" id="wallpaper-url" placeholder="Digite a URL da imagem">
    </div>

    <script src="script.js"></script>
</body>
</html>
